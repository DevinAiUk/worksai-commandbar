name: CI/CD — worksai-commandbar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Forbidden Brand & Secret Hygiene Gate
        run: |
          ! grep -rnI -iE "devon|devinai\.uk|BEGIN RSA PRIVATE KEY" src/ docs/

      - name: TypeScript & ES Module Syntax Verification
        run: |
          node --check src/worker.mjs
          npx --yes --package=typescript@5.8.2 tsc --noEmit

      - name: Verify Binary Release Package Integrity (worksai-commandbar-1.2.0.tgz)
        run: |
          test -s releases/worksai-commandbar-1.2.0.tgz
          tar -tzf releases/worksai-commandbar-1.2.0.tgz | head -n 20

      - name: Run Unit, Multi-Step Tenant CRUD, Export & Telemetry Tests
        run: node --test tests/worker.test.mjs
