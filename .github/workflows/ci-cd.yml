name: CI/CD — worksai-commandbar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies from Lockfile
        run: npm ci

      - name: Run Lint & Brand/Secret Hygiene Gate
        run: npm run lint

      - name: Run TypeScript & Syntax Verification
        run: npm run typecheck

      - name: Build Production Bundle (dist/worker.mjs) & Verify UI Assets
        run: |
          npm run build
          test -s dist/worker.mjs
          grep -q "companionTableBody" dist/worker.mjs
          grep -q "BUNDLED_APP_JS" dist/worker.mjs

      - name: Install & Execute CLI Tarball Package (.tgz)
        run: |
          mkdir -p /tmp/cb-cli && tar -xzf releases/worksai-commandbar-1.2.0.tgz -C /tmp/cb-cli
          out=$(node /tmp/cb-cli/package/bin/worksai-commandbar.mjs "128 * 4 + 256")
          echo "Executed CommandBar CLI: $out"
          echo "$out" | grep -q '"value":768'

      - name: Run Automated Unit, Server HMAC Auth, Spoof 401 & Tenant Isolation 403 Tests
        run: npm test

      - name: Live Domain Smoke Verification (commandbar.worksai.org)
        run: |
          curl -fsSL -A "Mozilla/5.0 (WorksAI-CI)" https://commandbar.worksai.org/api/health | grep -q '"status":"ok"'
          curl -fsSL -A "Mozilla/5.0 (WorksAI-CI)" https://commandbar.worksai.org/assets/app.js | grep -q 'window.WAI'
